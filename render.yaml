services:
  - type: web
    name: kamilya-lms-api
    runtime: python
    plan: starter
    rootDir: apps/api
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Apply schema changes once before replacing the live instance.
    # Without this, schema-affecting code in a new deploy can start against
    # an older database revision.
    # See ERRORS.md MIGRATION-001 for the root cause and release check.
    preDeployCommand: PYTHONPATH=. alembic upgrade head
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: DEPLOYMENT_ENVIRONMENT
        value: render-development
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: QWEN_API_URL
        value: "http://10.66.66.7:8555/v1"
      - key: QWEN_EMBEDDING_URL
        value: "http://10.66.66.7:8001/v1"
      # Render has no verified route into the private WireGuard model pool.
      # Enable only after an API-host network smoke proves /v1/models and a
      # non-PII chat completion from the actual runtime.
      - key: FREE_LLM_POOL_ENABLED
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com/v1"
      - key: DEEPSEEK_MODEL
        value: "deepseek-v4-flash"
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_BASE_URL
        value: "https://api.voyageai.com/v1"
      - key: VOYAGE_MODEL
        value: "voyage-4-lite"
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_BASE_URL
        value: "https://api.cohere.com/v2"
      - key: COHERE_EMBED_MODEL
        value: "embed-v4.0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Kamilya LMS <no-reply@notify.kml.kz>"
      - key: PUBLIC_LEAD_NOTIFICATION_EMAIL
        value: "askar0007amirkhanov@gmail.com"
      - key: CORS_ORIGINS
        value: '["https://app.kml.kz","https://www.kml.kz","https://web-inky-three-48.vercel.app","https://web-natt1inhm-kamillalmscrms-projects.vercel.app"]'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: "Kamilya LMS"
      - key: STORAGE_BACKEND
        value: "supabase"
      - key: PUBLIC_URL
        value: "https://app.kml.kz"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  # Celery worker: deployed on the project VPS (173.249.51.164, Ubuntu 24.04)
  # as a systemd unit, NOT as a Render Worker Service. See
  # docs/INFRA_CELERY_WORKER.md for full setup instructions.
