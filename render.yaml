services:
  - type: web
    name: kamilya-lms-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Render Free does not run pre-deploy commands. Schema-affecting DEV
    # releases must first run the fail-closed public-schema gate from the
    # repository root. See ERRORS.md DEV-SCHEMA-001:
    #   <canonical-api-python> scripts/ops/dev_public_schema_gate.py --apply
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: DEPLOYMENT_ENVIRONMENT
        value: render-development
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: QWEN_API_URL
        value: "http://10.66.66.7:8555/v1"
      - key: QWEN_EMBEDDING_URL
        value: "http://10.66.66.7:8001/v1"
      # Render has no verified route into the private WireGuard model pool.
      # Enable only after an API-host network smoke proves /v1/models and a
      # non-PII chat completion from the actual runtime.
      - key: FREE_LLM_POOL_ENABLED
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com/v1"
      - key: DEEPSEEK_MODEL
        value: "deepseek-v4-flash"
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_BASE_URL
        value: "https://api.voyageai.com/v1"
      - key: VOYAGE_MODEL
        value: "voyage-4-lite"
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_BASE_URL
        value: "https://api.cohere.com/v2"
      - key: COHERE_EMBED_MODEL
        value: "embed-v4.0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Kamilya LMS <no-reply@notify.kml.kz>"
      - key: PUBLIC_LEAD_NOTIFICATION_EMAIL
        value: "askar0007amirkhanov@gmail.com"
      - key: CORS_ORIGINS
        value: '["https://app.kml.kz","https://www.kml.kz","https://kamilya-lms-dev.vercel.app","https://web-inky-three-48.vercel.app","https://web-natt1inhm-kamillalmscrms-projects.vercel.app"]'
      - key: AUTH_BROWSER_ORIGINS
        value: '["https://kamilya-lms-dev.vercel.app"]'
      - key: AUTH_COOKIE_PROFILE
        value: cross_site
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_REFRESH_BODY_FALLBACK
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: "Kamilya LMS"
      - key: STORAGE_BACKEND
        value: "supabase"
      - key: PUBLIC_URL
        value: "https://app.kml.kz"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  # This Render service belongs to the non-production dev/demo contour.
  # KZ production workers run with the production API on VM126; see
  # docs/PROJECT-CONTEXT.md and the production deployment skill.
