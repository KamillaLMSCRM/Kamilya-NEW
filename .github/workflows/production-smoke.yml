name: Production smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Exact deployed release SHA for an explicit post-deploy check"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verifier
        uses: actions/checkout@v4

      - name: Verify KZ production identity and endpoints
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha || '' }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if python scripts/ops/verify_production_endpoint.py; then
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 30
            fi
          done
          exit 1

      - name: Open or update incident issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] KZ production identity smoke failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              `KZ production identity smoke failed at ${new Date().toISOString()}.`,
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close recovered incident
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] KZ production identity smoke failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `KZ production identity smoke recovered at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Fail workflow when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
