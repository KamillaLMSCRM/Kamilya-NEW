# Kamilya LMS — CI pipeline
#
# Gates:
#   1. Lint:      ruff (E/F/I/N/W/UP/B)
#   2. Types:     mypy strict on app/ — non-blocking warning for now (TODO: hard-fail)
#   3. Tenant security gate (custom script): every select() on tenant tables
#      filters by tenant_id OR is whitelisted. Fails PR if violated.
#   4. Tests:     pytest with coverage on app/modules/. fail-under=50 baseline.
#   5. Frontend:  tsc --noEmit + next lint
#   6. Secrets:   detect-secrets scan on changed files
#   7. Version:   VERSION == apps/api/pyproject.toml == apps/web/package.json,
#                 CHANGELOG.md keeps an [Unreleased] section (AGENTS.md
#                 §Версионирование продукта и release-notes)
#
# See AGENTS.md §Mandatory skill loading and §Security checklist for the
# rules this workflow enforces.

name: CI

on:
  push:
    branches: [master, main, develop, dev]
  pull_request:
    branches: [master, main, develop, dev]

# Cancel in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.5"

jobs:
  # ---------------------------------------------------------------------------
  # Backend lint + type debt baseline (blocking for new violations)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Python quality baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock', 'apps/api/pyproject.toml') }}

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Ruff and mypy regression gate
        run: poetry run python ../../scripts/ci/python_quality_baseline.py

  # ---------------------------------------------------------------------------
  # Release contract and tenant-isolation gates (blocking)
  # ---------------------------------------------------------------------------
  release-security-gates:
    name: Release and tenant security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Shell script quality gate
        run: bash scripts/ci/shell-quality-gate.sh

      - name: Tenant-id security gate
        run: bash scripts/ci/tenant-gate.sh

      - name: Alembic and Celery release contract
        run: python scripts/ci/release-contract-gate.py

      - name: Product version consistency gate
        run: python scripts/validate_version.py

  # ---------------------------------------------------------------------------
  # Backend unit tests + syntax compile (fast-fail gate, no Postgres needed)
  # ---------------------------------------------------------------------------
  # This job runs BEFORE the heavier backend-tests job so syntax errors and
  # pure-Python unit-test regressions are caught in <30s without spinning up
  # the Postgres + Redis service containers.
  #
  # Scope:
  #   1. python -m compileall — catches syntax errors / indentation issues.
  #   2. pytest tests/unit    — no DB / no storage backend. Runs hermetic
  #      parser / validator / security-helper tests.
  #
  # Heavy integration tests (with Postgres + Redis) live in `backend-tests`.
  # ---------------------------------------------------------------------------
  backend-unit:
    name: Backend unit tests (no DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Version-consistency contract tests
        run: poetry run pytest -q ../../scripts/tests/test_validate_version.py ../../scripts/ci/test_validate_version_workflow_contract.py

      - name: Syntax compile (compileall)
        run: |
          echo "Running compileall on app/ + tests/ — fail fast on syntax errors"
          poetry run python -m compileall app tests

      - name: KB-RAG gate scripts syntax and safety
        run: |
          poetry run python -m py_compile \
            ../../scripts/ops/kb_rag_isolated_dev_gate.py \
            ../../scripts/ops/kb_rag_application_dev_gate.py \
            ../../scripts/ci/kb_rag_schema_contract.py \
            ../../scripts/ci/critical_journey_gate.py
          poetry run pytest -q \
            ../../scripts/ops/test_kb_rag_isolated_dev_gate.py \
            ../../scripts/ops/test_kb_rag_application_dev_gate.py \
            ../../scripts/ci/test_kb_rag_schema_contract.py \
            ../../scripts/ci/test_critical_journey_gate.py
          poetry run python ../../scripts/ci/critical_journey_gate.py --all

      - name: pytest tests/unit (no DB)
        run: |
          echo "Running pure-Python unit tests (no Postgres / Redis required)"
          poetry run pytest tests/unit -v --tb=short

  # ---------------------------------------------------------------------------
  # Backend tests + coverage
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_test_password
          POSTGRES_DB: kamilya_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://lms:lms_test_password@localhost:5432/kamilya_lms_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lms:lms_test_password@localhost:5432/kamilya_lms_test
      ASSIGNMENT_RECOVERY_DATABASE_URL: postgresql+asyncpg://lms_recovery:lms_recovery_test_password@localhost:5432/kamilya_lms_test
      CANDIDATE_RETENTION_DATABASE_URL: postgresql+asyncpg://lms_candidate_retention:lms_candidate_retention_test_password@localhost:5432/kamilya_lms_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test_jwt_secret_for_ci_only_min_length_32
      JWT_AUDIENCE: kamilya-lms
      PROVIDER_KEY_ENCRYPTION_KEY: ZGV2X2tleV9tdXN0X2JlXzMyX2J5dGVzX2xvbmc=  # 32-byte base64 dev key
      MASTER_ENCRYPTION_KEY: ZGV2X2tleV9tdXN0X2JlXzMyX2J5dGVzX2xvbmc=
      APP_ENV: test
      DEBUG: "false"
      RLS_GATE_CONFIRMATION: EPHEMERAL_POSTGRES_ONLY
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Provision restricted application role
        run: |
          poetry run python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  user="lms",
                  password="lms_test_password",
                  database="kamilya_lms_test",
                  host="localhost",
              )
              try:
                  await conn.execute("""
                      DO $$
                      BEGIN
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'lms_app') THEN
                              CREATE ROLE lms_app LOGIN PASSWORD 'lms_app_test_password'
                                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
                          END IF;
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'lms_recovery') THEN
                              CREATE ROLE lms_recovery LOGIN PASSWORD 'lms_recovery_test_password'
                                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
                          END IF;
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'lms_candidate_retention') THEN
                              CREATE ROLE lms_candidate_retention LOGIN PASSWORD 'lms_candidate_retention_test_password'
                                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
                          END IF;
                      END
                      $$;
                  """)
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Run migrations
        run: |
          PYTHONPATH=. poetry run alembic upgrade head

      - name: KB-RAG PostgreSQL 17 schema contract (read-only)
        run: poetry run python ../../scripts/ci/kb_rag_schema_contract.py

      - name: HBR-03 and HBR-07 focused release tests
        run: |
          poetry run pytest -q \
            tests/test_embedding_provenance_migration.py \
            tests/test_embedding_chunk_index_migration.py \
            tests/test_document_embedding_fts_migration.py \
            tests/test_embedding_reindex_lifecycle_migration.py \
            tests/unit/test_embedding_reindex_lifecycle.py \
            tests/unit/test_embedding_reindex_store.py \
            tests/unit/test_embedding_reindex_vector_store.py \
            tests/unit/test_vector_store_provenance.py \
            tests/unit/test_context_expansion.py \
            tests/unit/test_document_compatibility.py

      - name: AI-COURSE-01 document-to-course critical journey
        run: |
          poetry run python ../../scripts/ci/critical_journey_gate.py \
            --all \
            --pytest-root apps/api \
            --emit-pytest-args /tmp/ai-course-01-tests.txt
          mapfile -t journey_tests < /tmp/ai-course-01-tests.txt
          poetry run pytest -q "${journey_tests[@]}"

      - name: PostgreSQL 17 + pgvector RLS release gate
        run: bash ../../scripts/ci/run_rls_release_gate.sh

      # -----------------------------------------------------------------------
      # Coverage gate — measured baseline. Raise it as test coverage grows.
      # Unlike the previous warn-only 70% target, this 50% gate is enforced.
      # -----------------------------------------------------------------------
      - name: pytest with coverage
        run: |
          PYTHONPATH=. poetry run pytest \
            --cov=app/modules \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage.xml

  # ---------------------------------------------------------------------------
  # Frontend type-check + lint
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend (tsc + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install detect-secrets
        run: python -m pip install detect-secrets

      - name: detect-secrets scan
        run: |
          detect-secrets scan \
            --exclude-files 'apps/api/.env.example|apps/web/.env.example|docs/.*' \
            --all-files
