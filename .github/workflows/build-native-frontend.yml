name: Build native frontend bundle

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character source commit
        required: true
        type: string
      workbench_enabled:
        description: Explicit controlled workbench activation (0.11.28 or newer)
        required: true
        type: boolean
        default: false
      document_draft_enabled:
        description: Explicit controlled document-draft activation (0.11.38 or newer)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kamilya-native-frontend-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      WORKBENCH_ENABLED: ${{ inputs.workbench_enabled }}
      DOCUMENT_DRAFT_ENABLED: ${{ inputs.document_draft_enabled }}
    steps:
      - name: Validate requested identity
        shell: bash
        run: |
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WORKBENCH_ENABLED}" == true || "${WORKBENCH_ENABLED}" == false ]]
          [[ "${DOCUMENT_DRAFT_ENABLED}" == true || "${DOCUMENT_DRAFT_ENABLED}" == false ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"

      # Build-only Linux container on the existing hosted CI runner. The artifact
      # runs natively under Node/OpenRC on Alpine CT137; no server Docker install.
      - name: Build Alpine-compatible native bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="$(mktemp -d "${RUNNER_TEMP}/kamilya-web-bundle.XXXXXX")"
          printf 'BUNDLE_DIR=%s\n' "${output_dir}" >> "${GITHUB_ENV}"
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/apps/web,target=/src,readonly" \
            --mount "type=bind,source=${output_dir},target=/out" \
            --env RELEASE_SHA \
            --env NEXT_PUBLIC_API_URL=https://api.kml.kz/api \
            --env NEXT_PUBLIC_METHODOLOGIST_WORKBENCH_ENABLED="${WORKBENCH_ENABLED}" \
            --env NEXT_PUBLIC_METHODOLOGIST_DOCUMENT_DRAFT_ENABLED="${DOCUMENT_DRAFT_ENABLED}" \
            --env NEXT_TELEMETRY_DISABLED=1 \
            node:20-alpine sh -euc '
              mkdir /build
              cp -a /src/. /build/
              cd /build
              node -e '\''const flag=process.env.NEXT_PUBLIC_METHODOLOGIST_WORKBENCH_ENABLED;const doc=process.env.NEXT_PUBLIC_METHODOLOGIST_DOCUMENT_DRAFT_ENABLED;if(!["true","false"].includes(flag)||!["true","false"].includes(doc))throw Error("feature_flag_invalid");const version=require("./package.json").version;if(!/^\d+\.\d+\.\d+$/.test(version))throw Error("version_invalid");const [a,b,c]=version.split(".").map(Number);if(flag==="true"&&!(a>0||b>11||(b===11&&c>=28)))throw Error("workbench_activation_requires_28");if(doc==="true"&&(flag!=="true"||!(a>0||b>11||(b===11&&c>=38))))throw Error("document_draft_activation_requires_38")'\''
              corepack enable
              corepack prepare pnpm@10.26.1 --activate
              pnpm install --frozen-lockfile
              pnpm audit --prod --audit-level moderate --registry https://registry.npmjs.org
              pnpm run lint
              pnpm run typecheck
              pnpm run build
              pnpm prune --prod
              test -f .next/BUILD_ID
              test -f next.config.js
              test -f security-headers.js
              test ! -f .env
              test ! -f .env.local
              # Next.js public assets are optional; preserve a stable archive layout.
              mkdir -p public
              # Alpine/musl cannot load these optional GNU binaries. Keep their
              # package directories/metadata and every musl binary; do not create
              # dangling pnpm links or remove general runtime dependencies.
              tar --exclude=.next/cache \
                --exclude="*/next-swc.linux-x64-gnu.node" \
                --exclude="*/skia.linux-x64-gnu.node" \
                -czf "/out/frontend-native-${RELEASE_SHA}.tar.gz" \
                .next public node_modules package.json next.config.js security-headers.js
              mkdir /verify
              tar -xzf "/out/frontend-native-${RELEASE_SHA}.tar.gz" -C /verify
              cd /verify
              NODE_ENV=production node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3300 >/tmp/native-web.log 2>&1 &
              server_pid=$!
              trap "kill $server_pid 2>/dev/null || true" EXIT
              node -e '\''const paths=["/login","/admin/settings/ai"];(async()=>{for(let i=0;i<30;i++){try{const r=await fetch("http://127.0.0.1:3300/login",{signal:AbortSignal.timeout(2000)});if(r.ok)break}catch{}await new Promise(r=>setTimeout(r,1000))}for(const p of paths){const r=await fetch("http://127.0.0.1:3300"+p,{signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error("native_bundle_http_"+r.status);const t=await r.text();if(!t.includes("<html"))throw Error("native_bundle_not_html")}console.log("NATIVE_BUNDLE_RUNTIME_PASS")})().catch(e=>{console.error(e.message);process.exitCode=1})'\''
              cd /out
              sha256sum "frontend-native-${RELEASE_SHA}.tar.gz" > bundle.sha256
              node -e '\''const fs=require("fs");const crypto=require("crypto");const p=require("/build/package.json");const flag=process.env.NEXT_PUBLIC_METHODOLOGIST_WORKBENCH_ENABLED;const doc=process.env.NEXT_PUBLIC_METHODOLOGIST_DOCUMENT_DRAFT_ENABLED;if(!["true","false"].includes(flag)||!["true","false"].includes(doc))throw Error("feature_flag_invalid");const [a,b,c]=p.version.split(".").map(Number);const documentSchema=doc==="true"||a>0||b>11||(b===11&&c>=38);const sha256=fs.readFileSync("bundle.sha256","utf8").split(" ")[0];fs.writeFileSync("manifest.json",JSON.stringify({release_sha:process.env.RELEASE_SHA,product_version:p.version,node_version:process.version,platform:process.platform,arch:process.arch,libc:"musl",api_url:process.env.NEXT_PUBLIC_API_URL,sha256},null,2)+"\n");const config={schema_version:documentSchema?2:1,release_sha:process.env.RELEASE_SHA,product_version:p.version,sha256,manifest_sha256:crypto.createHash("sha256").update(fs.readFileSync("manifest.json")).digest("hex"),workbench_enabled:flag==="true"};if(documentSchema)config.document_draft_enabled=doc==="true";fs.writeFileSync("build-config.json",JSON.stringify(config,null,2)+"\n")'\''
            '

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-native-${{ inputs.release_sha }}
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 14
