Match User kamilya-dev-models
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/kamilya-dev-models-20261016.keys
    AllowTcpForwarding local
    PermitOpen 10.77.77.2:18999 10.77.77.4:18005
    PermitListen none
    GatewayPorts no
    AllowStreamLocalForwarding no
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
