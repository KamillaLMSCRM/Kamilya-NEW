# Backend monorepo config
[tool.poetry]
name = "api"
version = "0.2.0"
description = "Kamilya LMS API"
authors = ["Kamilya Team <dev@kml.kz>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
starlette = "^1.6.0"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = "^2.0.35"
asyncpg = "^0.30"
pydantic = "^2.9"
pydantic-settings = "^2.5"
email-validator = "^2.0"
pyjwt = "^2.10"
argon2-cffi = "^23.1"
celery = "^5.4"
psutil = "^6.1"
redis = "^5.2"
python-multipart = "^0.0.32"
alembic = "^1.14"
httpx = "^0.27"
websockets = "^14.0"
# YouTube public-caption adapter (experimental, YTG-06). MIT, pinned minor.
# Feature-flagged off by default (YOUTUBE_IMPORT_ENABLED).
youtube-transcript-api = { version = ">=1.2.4,<2.0.0", python = ">=3.12,<3.15" }
openpyxl = "^3.1"
xlrd = "^2.0.1"
pypdf = "^6.17.0"
python-docx = "^1.1"
defusedxml = "^0.7.1"
json-repair = "^0.63.4"
supabase = "^2.0"
cryptography = "^50.0.1"
aiosmtplib = "^5.1.2"
jinja2 = "^3.1"
fpdf2 = "^2.8"
qrcode = "^8.2"
packages = {path = "../../packages", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.8"
mypy = "^1.13"
httpx = "^0.27"
types-defusedxml = "^0.7.0.20260504"

[tool.poetry.group.observability.dependencies]
# Sentry SDK with FastAPI + SQLAlchemy + asyncpg integrations.
# Activated only when SENTRY_DSN env var is set (see app/main.py).
# Optional group so apps without observability needs can `poetry install --without observability`.
sentry-sdk = {extras = ["fastapi"], version = "^2.0"}
python-json-logger = "^2.0"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
