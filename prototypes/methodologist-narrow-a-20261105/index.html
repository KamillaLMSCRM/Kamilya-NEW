<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202a3b;background:#f7f6f1;line-height:1.5}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f4aa49;outline-offset:3px}.skip{position:absolute;top:-5rem;left:1rem;background:white;z-index:5;padding:.7rem}.skip:focus{top:1rem}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e7e9eb;padding:28px 16px;display:flex;flex-direction:column;gap:25px}.brand{font-weight:800;letter-spacing:-.05em;font-size:25px;color:#244b8f;padding:0 10px}.brand span{color:#df9c55}.role{padding:0 10px;color:#758095;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;color:#59667b;border-radius:9px;font-weight:600}.nav button:hover{background:#f3f6fb}.nav button.active{background:#eaf1fc;color:#28589c}.nav .ico{display:inline-block;width:26px;color:#8292a9}.side-note{margin-top:auto;background:#f7f8fa;color:#778297;padding:14px;border-radius:10px;font-size:12px}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e8e9e8;display:flex;align-items:center;justify-content:space-between;padding:0 40px;color:#68748a;font-size:13px}.avatar{display:flex;align-items:center;gap:10px;color:#334155;font-weight:600}.avatar i{font-style:normal;background:#e9eff9;color:#365d97;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.content{max-width:1500px;margin:auto;padding:34px 40px 60px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:800;color:#6681a8}.heading{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}h1{font-size:30px;letter-spacing:-.035em;margin:4px 0;color:#202d40}h2{font-size:20px;letter-spacing:-.02em;margin:0}h3{font-size:16px;margin:0}p{margin:7px 0;color:#6a778a}.notice{background:#fff7e7;border:1px solid #f1d8a8;color:#6a532d;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:24px}.notice strong{color:#59401c}.fixture{display:flex;align-items:center;gap:8px;font-size:12px;color:#69758a;flex-wrap:wrap}.fixture select{border:1px solid #d9e0e9;background:#fff;border-radius:8px;padding:8px;color:#334155}.workspace{display:grid;grid-template-columns:minmax(300px, .95fr) minmax(320px,1.25fr);gap:20px;align-items:start}.panel{background:#fff;border:1px solid #e6e9ed;border-radius:14px;box-shadow:0 4px 18px #2b406008;min-width:0}.panel-head{padding:22px 22px 15px}.panel-head p{font-size:13px}.filters{display:flex;gap:6px;padding:0 22px 15px;flex-wrap:wrap}.chip{border:1px solid #e5e9ef;background:white;color:#647187;border-radius:20px;font-size:12px;padding:7px 11px}.chip.active{background:#eaf1fc;border-color:#cbdcf5;color:#285a9f;font-weight:700}.task{width:100%;text-align:left;border:0;border-top:1px solid #edf0f3;background:white;padding:17px 20px;display:flex;gap:13px;color:inherit}.task:hover{background:#fafcff}.task.selected{background:#f4f8fe;box-shadow:inset 3px 0 #4b7dc1}.symbol{flex:0 0 36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#fff1e8;color:#bb7044;font-weight:800}.symbol.blue{background:#eaf2fd;color:#4b78b5}.symbol.red{background:#fbeeee;color:#b86565}.task-body{min-width:0;flex:1}.task-title{font-weight:700;font-size:14px}.task-desc{font-size:12px;color:#788499;margin-top:4px}.task-meta{font-size:11px;color:#8a96a6;margin-top:8px}.arrow{color:#a3afbd}.detail{padding:25px}.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:#fff3e9;color:#9a6039;font-size:11px;font-weight:700}.badge.blue{background:#eaf2fd;color:#416da8}.badge.red{background:#fbeeee;color:#a35b5b}.detail h2{font-size:23px;margin:15px 0 8px}.detail p{font-size:14px}.rule{height:1px;background:#edf0f3;margin:23px 0}.info{display:grid;grid-template-columns:1fr 1fr;gap:18px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#96a0ad;font-weight:700}.value{font-size:13px;color:#344258;margin-top:4px}.next{background:#f5f8fd;border:1px solid #e5edf9;border-radius:10px;padding:16px;margin-top:24px}.next h3{font-size:13px;color:#365d96}.next p{font-size:13px}.primary,.secondary{border-radius:8px;padding:10px 15px;font-weight:700;font-size:13px;margin-top:10px}.primary{background:#3769ad;border:1px solid #3769ad;color:white}.primary:hover{background:#285997}.secondary{background:#fff;border:1px solid #dce3ed;color:#466184}.state{padding:38px 22px;text-align:center;color:#778499;font-size:13px}.state strong{display:block;color:#354459;font-size:15px;margin-bottom:6px}.crumb{background:none;border:0;color:#4776b6;padding:0;font-size:13px}.section{padding:22px;margin-top:16px}.section h3{margin-bottom:10px}.source{border-left:3px solid #98b6dc;padding:2px 0 2px 14px;margin:14px 0}.tag{display:inline-block;background:#f1f4f7;border-radius:5px;padding:3px 7px;color:#68778c;font-size:11px;margin:3px 4px 3px 0}.tag.warn{background:#fff4e4;color:#95632c}.answer{background:#edf7ef;color:#39784c;padding:10px 12px;border-radius:8px;font-size:13px}.readonly{font-size:12px;color:#7c8795}.destination{max-width:720px;padding:26px}.destination p{font-size:14px}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
body,main,section,div,p,h1,h2,h3,button,li{overflow-wrap:anywhere}button,select{max-width:100%}.info>div,.heading>div{min-width:0}li{padding:5px 0}.label,.task-meta,.task-desc,.readonly,.role,.side-note,.eyebrow,.fixture{color:#58677b}.tag{color:#526176}.tag.warn{color:#79501d}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

</style></head><body><a class="skip" href="#main">Перейти к содержимому</a><div class="shell"><aside class="sidebar"><div class="brand">kamilya<span>.</span></div><div class="role">Рабочее пространство</div><nav class="nav" aria-label="Основная навигация"><button data-nav="tasks" class="active"><span class="ico">◫</span>Задачи</button><button data-nav="courses"><span class="ico">▤</span>Курсы</button><button data-nav="staff"><span class="ico">♧</span>Сотрудники</button><button data-nav="assignments"><span class="ico">✓</span>Назначения</button><button data-nav="journal"><span class="ico">▧</span>Журнал обучения</button></nav><div class="side-note">Прототип интерфейса<br>Данные вымышлены</div></aside><div class="main"><header class="top"><span>Рабочее пространство / Методолог</span><div class="avatar"><i>М</i> Методолог</div></header><main id="main" class="content" tabindex="-1"><div id="view"></div></main></div></div><div id="status" class="status" role="status" aria-live="polite"></div>
<script>
const tasks=[{id:'generation',category:'generation',icon:'!',iconClass:'',badge:'Требует внимания',title:'Не удалось создать курс',object:'Основы информационной безопасности',description:'Генерация остановилась. Посмотрите контекст задания и проверьте исходные материалы.',meta:'Пример · генерация',label:'Генерация курса',next:'Открыть задание',hint:'Посмотрите сведения об остановленном задании и перейдите к курсу.'},{id:'review',category:'review',icon:'▤',iconClass:'blue',badge:'На проверке',title:'Курс ожидает проверки',object:'Введение в охрану труда',description:'Просмотрите материалы курса перед дальнейшим согласованием.',meta:'Пример · проверка курса',label:'Проверка курса',next:'Открыть курс',hint:'Откройте курс и перейдите к доступному контексту согласования.'},{id:'overdue',category:'assignment',icon:'◷',iconClass:'red',badge:'Просрочено',title:'Назначение просрочено',object:'Адаптация новых сотрудников',description:'Срок выполнения назначения истёк. Откройте назначение, чтобы разобраться в ситуации.',meta:'Пример · назначение',label:'Назначение',next:'Открыть назначение',hint:'Детали и дальнейшие действия находятся в карточке назначения.'}];
const categories=[['all','Все'],['generation','Генерация'],['review','Проверка'],['assignment','Назначения']];
let selected='generation',filter='all',fixture='ready',screen='tasks',courseTab='overview',sourceState='current';
const view=document.getElementById('view'),status=document.getElementById('status');
function announce(text){status.textContent=text}
function nav(){document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===screen||(screen==='course'&&b.dataset.nav==='courses');b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function intro(title,sub){return `<div class="heading"><div><div class="eyebrow">Рабочее пространство методолога</div><h1>${title}</h1><p>${sub}</p></div></div><div class="notice"><strong>Интерактивный прототип · синтетические данные.</strong> Ничего не сохраняется и не изменяется на сервере.</div>`}
function taskList(){let shown=tasks.filter(t=>filter==='all'||t.category===filter);if(fixture==='filtered-empty')shown=[];return shown.length?shown.map(t=>`<button class="task ${selected===t.id?'selected':''}" data-task="${t.id}" aria-pressed="${selected===t.id}"><span class="symbol ${t.iconClass}" aria-hidden="true">${t.icon}</span><span class="task-body"><span class="task-title">${t.title}</span><span class="task-desc" style="display:block">${t.object}</span><span class="task-meta" style="display:block">${t.meta}</span></span><span class="arrow" aria-hidden="true">›</span></button>`).join(''):'<div class="state"><strong>В этой категории задач нет</strong>Это синтетический пример пустого результата фильтра.</div>'}
function detail(){const t=tasks.find(x=>x.id===selected);if(!t||!(filter==='all'||t.category===filter))return '<div class="state"><strong>Выберите задачу</strong>Подробности появятся здесь.</div>';return `<div class="detail"><span class="badge ${t.iconClass}">${t.badge}</span><h2>${t.title}</h2><p>${t.description}</p><div class="rule"></div><div class="info"><div><div class="label">Объект</div><div class="value">${t.object}</div></div><div><div class="label">Тип</div><div class="value">${t.label}</div></div></div><div class="next"><h3>Следующий шаг</h3><p>${t.hint}</p><button class="primary" data-action="${t.id}">${t.next} <span aria-hidden="true">→</span></button></div></div>`}
function renderTasks(){const states={empty:['Задач пока нет','В этом демонстрационном состоянии список пуст.'],loading:['Загрузка задач','Демонстрация состояния загрузки.'],unavailable:['Данные недоступны','В прототипе показано состояние недоступности, а не состояние сервера.'],error:['Не удалось загрузить задачи','Демонстрация ошибки. Выберите другое состояние для продолжения.']};const detailStates={empty:'Нет задачи для просмотра.',loading:'Подробности появятся после загрузки.',unavailable:'Источник подробностей недоступен.',error:'Не удалось получить подробности.', 'filtered-empty':'Для выбранной категории подробностей нет.',partial:'Список примеров доступен, но подробности временно недоступны.'};const listAvailable=['ready','filtered-empty','partial'].includes(fixture);view.innerHTML=`<div class="heading"><div><div class="eyebrow">Рабочее пространство методолога</div><h1>Задачи</h1><p>То, что требует вашего внимания</p></div><label class="fixture">Состояние примера <select id="fixture"><option value="ready">Примеры задач</option><option value="filtered-empty">Пустой фильтр</option><option value="partial">Частично недоступно</option><option value="empty">Пусто</option><option value="loading">Загрузка</option><option value="unavailable">Недоступно</option><option value="error">Ошибка</option></select></label></div><div class="notice"><strong>Интерактивный прототип · синтетические данные.</strong> Ничего не сохраняется и не изменяется на сервере.</div><div class="workspace"><section class="panel" aria-labelledby="list-title"><div class="panel-head"><h2 id="list-title">Входящие задачи</h2><p>Выберите задачу, чтобы увидеть подробности</p></div><div class="filters" aria-label="Категория задач">${categories.map(([id,name])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${name}</button>`).join('')}</div>${listAvailable?taskList():`<div class="state"><strong>${states[fixture][0]}</strong>${states[fixture][1]}</div>`}</section><section id="task-detail" tabindex="-1" class="panel" aria-label="Подробности задачи">${fixture==='ready'?detail():`<div class="state"><strong>Подробности</strong>${detailStates[fixture]}</div>`}<button class="crumb" style="margin:0 20px 18px" data-list>← К списку задач</button></section></div>`;document.getElementById('fixture').value=fixture}
function renderCourse(){const t=tasks.find(x=>x.id===selected)||tasks[1];const name=t.id==='generation'?t.object:'Введение в охрану труда';const provenance={current:'Актуально: раздел 1, синтетическая цитата: «Перед началом работы ознакомьтесь с инструкцией и проверьте рабочее место».',missing:'Фрагмент происхождения отсутствует.',stale:'Историческая версия 2; текущая версия 3. Проверьте актуальность.'};view.innerHTML=intro(name,'Карточка курса · пример')+`<button class="crumb" data-back>← К задачам</button><section class="panel section"><div class="eyebrow">Курс · синтетический пример</div><h2>${name}</h2><p>Здесь показан контекст существующего курса. Изменения и отправка не выполняются.</p><div><button class="${courseTab==='overview'?'primary':'secondary'}" data-tab="overview" aria-pressed="${courseTab==='overview'}">Обзор</button> <button class="${courseTab==='prep'?'primary':'secondary'}" data-tab="prep" aria-pressed="${courseTab==='prep'}">Подготовка материалов</button> <button class="${courseTab==='agreement'?'primary':'secondary'}" data-tab="agreement" aria-pressed="${courseTab==='agreement'}">Согласование курса</button></div></section>${courseTab==='overview'?`<section class="panel section"><h3>Материалы курса</h3><p>Просмотрите подготовленные материалы и их происхождение до следующих действий.</p><button class="secondary" data-tab="prep" aria-pressed="${courseTab==='prep'}">Открыть подготовку материалов →</button><div class="rule"></div><h3>Согласование</h3><p>Контекстная точка входа в согласование этого курса.</p><button class="secondary" data-tab="agreement" aria-pressed="${courseTab==='agreement'}">Открыть согласование →</button></section>`:courseTab==='agreement'?`<section class="panel section"><h3>Согласование курса</h3><p>Это демонстрация входа из карточки курса. Решение о согласовании здесь не принимается и не отправляется.</p><span class="tag">Только просмотр</span></section>`:`<section class="panel section"><div class="eyebrow">Подготовка C · только просмотр</div><h3>Источник, урок и вопрос</h3><p class="readonly">Пример помогает проверить связь материалов с источником. Утверждение вопросов и автоматическое применение не предусмотрены.</p><label class="fixture">Состояние источника в примере <select id="source-state"><option value="current">Актуальный</option><option value="missing">Нет фрагмента</option><option value="stale">Устаревший</option></select></label><div class="source"><strong>Источник: инструкция по безопасности</strong><p>Вымышленный документ · версия 2</p><span class="tag">Версия источника: 2</span><span class="tag ${sourceState==='current'?'':'warn'}">${provenance[sourceState]}</span></div><div class="rule"></div><div class="label">Урок 1</div><h3>Безопасное начало работы</h3><p>Перед началом работы ознакомьтесь с инструкцией и проверьте рабочее место.</p><div class="rule"></div><div class="label">Пример вопроса</div><h3>Что следует сделать перед началом работы?</h3><ol><li class="${sourceState==='current'?'answer':'tag warn'}">Ознакомиться с инструкцией и проверить рабочее место. <strong>${sourceState==='current'?'✓ Правильный ответ':'Ответ в примере · не проверен по источнику'}</strong></li><li>Начать работу без проверки.</li><li>Передать проверку случайному посетителю.</li></ol><p>Объяснение: инструкция и проверка рабочего места помогают обнаружить риски до начала работы.</p><p class="readonly">Происхождение: версия источника 2 · ${provenance[sourceState]}</p></section>`}`;if(courseTab==='prep')document.getElementById('source-state').value=sourceState}
function renderJob(){view.innerHTML=intro('Не удалось создать курс','Задание генерации · синтетический пример')+`<button class="crumb" data-back>← К задачам</button><section class="panel section"><span class="badge">Остановлено</span><h2>Основы информационной безопасности</h2><p>Пример задания GEN-024 · этап: обработка исходного документа</p><div class="rule"></div><h3>Причина остановки</h3><p>В демонстрационном примере не удалось прочитать часть исходного документа. Проверьте файл и его доступность в карточке курса.</p><p class="readonly">Безопасное описание ошибки; технические детали и реальные данные отсутствуют. Повторный запуск здесь не выполняется. Маршрут к заданию — синтетический; существование целевого маршрута не проверено (зависимость A0).</p><button class="primary" data-open-course>Открыть курс →</button></section>`}
function renderAssignment(){view.innerHTML=intro('Назначение просрочено','Карточка назначения · синтетический пример')+`<button class="crumb" data-back>← К задачам</button><section class="panel section"><span class="badge red">Просрочено</span><h2>Адаптация новых сотрудников</h2><div class="info"><div><div class="label">Срок</div><div class="value">30 октября 2026 · пример</div></div><div><div class="label">Происхождение</div><div class="value">Создано вручную, не правилом</div></div></div><div class="rule"></div><h3>Причина</h3><p>В примере срок прошёл, а завершение не зафиксировано. Причина незавершения неизвестна.</p><button class="secondary" data-journal>Посмотреть контекст журнала →</button></section>`}
function renderJournalContext(){view.innerHTML=intro('Журнал обучения','Контекст назначения · синтетический пример')+`<button class="crumb" data-assignment>← К назначению</button><section class="panel section"><h2>Адаптация новых сотрудников</h2><p>Пример записи: завершение не зафиксировано; срок — 30 октября 2026.</p><h3>Экспорт</h3><p>В рабочем продукте журнал может использоваться для получения данных. Этот прототип ничего не выгружает и не создаёт файл.</p><span class="tag">Только просмотр</span></section>`}
function renderDestination(){const names={courses:['Курсы','Здесь в продукте находится список курсов. В этом прототипе доступны только примеры из задач.'],staff:['Сотрудники','Здесь в продукте находится работа с сотрудниками. Этот раздел не реализован в прототипе.'],assignments:['Назначения','Здесь в продукте находятся назначения. Этот раздел не реализован в прототипе.'],journal:['Журнал обучения','Здесь в продукте находится журнал обучения. Этот раздел не реализован в прототипе.']};let [name,description]=names[screen];view.innerHTML=intro(name,'Раздел показан для сохранения контекста навигации')+`<section class="panel destination"><h2>${name}</h2><p>${description}</p><button class="secondary" data-back>← Вернуться к задачам</button></section>`}
function render(){nav();if(screen==='tasks')renderTasks();else if(screen==='course')renderCourse();else if(screen==='job')renderJob();else if(screen==='assignment-detail')renderAssignment();else if(screen==='journal-context')renderJournalContext();else renderDestination()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){screen=n.dataset.nav;render();document.getElementById('main').focus();announce('Открыт раздел: '+n.textContent.trim());return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;const visible=tasks.filter(t=>filter==='all'||t.category===filter);if(!visible.some(t=>t.id===selected))selected=visible[0]?.id;render();document.querySelector(`[data-filter="${filter}"]`)?.focus();announce('Категория: '+f.textContent.trim());return}const t=e.target.closest('[data-task]');if(t){selected=t.dataset.task;render();if(matchMedia('(max-width: 900px)').matches)document.getElementById('task-detail').focus();else document.querySelector(`[data-task="${selected}"]`)?.focus();announce(fixture==='partial'?'Подробности задачи недоступны': 'Выбрана задача: '+tasks.find(x=>x.id===selected).title);return}const a=e.target.closest('[data-action]');if(a){screen=a.dataset.action==='overdue'?'assignment-detail':a.dataset.action==='generation'?'job':'course';courseTab='overview';render();document.querySelector('#main').focus();announce('Открыта карточка примера');return}if(e.target.closest('[data-open-course]')){screen='course';courseTab='overview';render();document.querySelector('#main').focus();announce('Открыт курс');return}if(e.target.closest('[data-journal]')){screen='journal-context';render();document.querySelector('#main').focus();announce('Открыт контекст журнала');return}if(e.target.closest('[data-assignment]')){screen='assignment-detail';render();document.querySelector('#main').focus();announce('Открыто назначение');return}const tab=e.target.closest('[data-tab]');if(tab){courseTab=tab.dataset.tab;render();document.querySelector(`[data-tab="${courseTab}"]`)?.focus();announce('Открыт раздел курса: '+tab.textContent.trim());return}if(e.target.closest('[data-list]')){(document.querySelector(`[data-task="${selected}"]`)||document.querySelector(`[data-filter="${filter}"]`)).focus();announce('Возврат к списку задач');return}if(e.target.closest('[data-back]')){screen='tasks';render();(document.querySelector(`[data-task="${selected}"]`)||document.querySelector(`[data-filter="${filter}"]`)||document.querySelector('#main')).focus();announce('Возврат к задачам')}});
document.addEventListener('change',e=>{if(e.target.id==='fixture'){fixture=e.target.value;render();document.getElementById('fixture').focus();announce('Состояние примера: '+document.getElementById('fixture').selectedOptions[0].textContent)}else if(e.target.id==='source-state'){sourceState=e.target.value;render();document.getElementById('source-state').focus();announce('Состояние источника: '+document.getElementById('source-state').selectedOptions[0].textContent)}});render();
</script></body></html>
